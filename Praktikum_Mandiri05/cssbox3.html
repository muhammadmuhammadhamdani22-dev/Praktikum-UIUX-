<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box 3</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .kuning { width: 20%; height: 10vh; background-color: yellow; border: 1px solid; }
        .oranye { width: 80%; height: 10vh; background-color: orangered; border: 1px solid; }
        .hijau  { width: 20%; height: 60vh; background-color: lightgreen; border: 1px solid; }
        .abu    { width: 60%; height: 60vh; background-color: lightgray; border: 1px solid; }
        .biru   { width: 20%; height: 60vh; background-color: deepskyblue; border: 1px solid; }
        .footer { width: 100%; height: 10vh; background-color: dodgerblue; border: 1px solid; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="kuning"></div>
            <div class="oranye"></div>
        </div>
        <div class="row">
            <div class="hijau"></div>
            <div class="abu"></div>
            <div class="biru"></div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
