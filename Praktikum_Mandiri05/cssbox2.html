<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box 2</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }
        .header {
            width: 100%;
            height: 15vh;
            background-color: lightgreen;
            border: 1px solid;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .kuning { width: 25%; height: 25vh; background-color: yellow; border: 1px solid; }
        .oranye { width: 75%; height: 25vh; background-color: orangered; border: 1px solid; }
        .biru   { width: 75%; height: 25vh; background-color: deepskyblue; border: 1px solid; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"></div>
        <div class="row">
            <div class="kuning"></div>
            <div class="oranye"></div>
        </div>
        <div class="row">
            <div class="kuning"></div>
            <div class="biru"></div>
        </div>
    </div>
</body>
</html>
