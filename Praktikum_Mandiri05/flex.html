<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Galeri Foto - Gambar 7</title>
    <link rel="stylesheet" href="css/flexbox.css">
</head>
<body>
    <div class="container">
        <!-- Baris 1: 3 foto lebar -->
        <div class="row-atas">
            <img src="img/burung1.jpg" alt="Foto 1">
            <img src="img/burung2.jpg" alt="Foto 2">
            <img src="img/burung3.jpg" alt="Foto 3">
        </div>
        <!-- Baris 2: 4 foto lebih kecil -->
        <div class="row-bawah">
            <img src="img/burung4.jpg" alt="Foto 4">
            <img src="img/burung1.jpg" alt="Foto 5">
            <img src="img/burung2.jpg" alt="Foto 6">
            <img src="img/burung3.jpg" alt="Foto 7">
        </div>
    </div>
</body>
</html>
