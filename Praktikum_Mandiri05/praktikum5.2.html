<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Image</title>
    <style>
        body {
            background-color: #f8f9e4;
        }
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 30px;
        }
        .box1 img, .box2 img, .box3 img, .box4 img {
            width: 280px;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"><img src="img/burung1.jpg" alt="Burung 1"></div>
        <div class="box2"><img src="img/burung2.jpg" alt="Burung 2"></div>
        <div class="box3"><img src="img/burung3.jpg" alt="Burung 3"></div>
        <div class="box4"><img src="img/burung4.jpg" alt="Burung 4"></div>
    </div>
</body>
</html>
